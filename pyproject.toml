[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "flyrank-social-studio"
version = "0.1.0"
description = "Backend capstone for the FlyRank Social Media Studio"
requires-python = ">=3.12"

dependencies = [
    "python-dotenv",
    "psycopg[binary]",
    "fastapi",
    "uvicorn",
    "pydantic",
    "httpx",
    "beautifulsoup4",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]